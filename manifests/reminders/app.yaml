enums:
  ReminderPriority:
    name: ReminderPriority
    description: Priority level for reminders
    code: '????'
    values:
      - name: noPriority
        value: 0
        description: No priority
        code: tdp0
      - name: lowPriority
        value: 9
        description: Low priority
        code: tdp9
      - name: mediumPriority
        value: 5
        description: Medium priority
        code: tdp5
      - name: highPriority
        value: 1
        description: High priority
        code: tdp1

hierarchy:
  children:
    accounts:
      resource: Account
      access: r
      description: Accounts in the application
    lists:
      resource: List
      access: rw
      description: Reminder lists in the application
      children:
        reminders:
          resource: Reminder
          access: rw
          description: Reminders within a list
    reminders:
      resource: Reminder
      access: rw
      description: Reminders in the application, across every list

commands:
  # List commands
  list:
    name: list
    description: List all reminder lists
    scope: resource
    resourceType: List
    code: core
    parameters: []

  get:
    name: get
    description: Get a reminder list by ID
    scope: resource
    resourceType: List
    code: getd
    parameters:
      - name: id
        type: string
        description: List identifier
        required: true

  create:
    name: create
    description: Create a new reminder list
    scope: resource
    resourceType: List
    code: crel
    parameters:
      - name: name
        type: string
        description: List name
        required: true
      - name: color
        type: string
        description: List color
        required: false

  # Reminder commands
  listReminders:
    name: list
    routeName: list
    description: List all reminders in a list
    scope: resource
    resourceType: Reminder
    parent:
      resource: List
      parameter: listId
    code: core
    parameters:
      - name: listId
        type: string
        description: List identifier
        required: true

  getReminder:
    name: get
    routeName: get
    description: Get a reminder by ID
    scope: resource
    resourceType: Reminder
    code: getd
    parameters:
      - name: id
        type: string
        description: Reminder identifier
        required: true

  createReminder:
    name: create
    routeName: create
    description: Create a new reminder
    scope: resource
    resourceType: Reminder
    parent:
      resource: List
      parameter: listId
    code: crel
    parameters:
      - name: listId
        type: string
        description: List identifier for the reminder
        required: true
      - name: name
        type: string
        description: Reminder name
        required: true
      - name: body
        type: string
        description: Reminder notes
        required: false
      - name: dueDate
        type: date
        description: Due date
        required: false
      - name: remindMeDate
        type: date
        description: Remind me date
        required: false
      - name: priority
        type: integer
        description: Priority (0=none, 1=high, 5=medium, 9=low)
        required: false
      - name: flagged
        type: boolean
        description: Whether to flag the reminder
        required: false

  deleteReminder:
    name: delete
    routeName: delete
    description: Delete a reminder
    scope: resource
    resourceType: Reminder
    code: dele
    parameters:
      - name: id
        type: string
        description: Reminder identifier
        required: true

  completeReminder:
    name: complete
    routeName: complete
    description: Mark a reminder as complete
    scope: resource
    resourceType: Reminder
    code: '????'
    parameters:
      - name: id
        type: string
        description: Reminder identifier
        required: true
    permission: reminders:reminders:update

  show:
    name: show
    description: Show the reminder in Reminders.app UI
    scope: resource
    resourceType: Reminder
    code: '????'
    parameters: []

  # Account commands
  listAccounts:
    name: list
    routeName: list
    description: List all accounts
    scope: resource
    resourceType: Account
    code: core
    parameters: []

# Permissions mapping - defines coarse->fine permission relationships
permissions:
  # Resource-level permissions
  lists:
    read:
      - reminders:lists:list
      - reminders:lists:get
    create:
      - reminders:lists:create

  reminders:
    read:
      - reminders:reminders:list
      - reminders:reminders:get
      - reminders:reminders:show
    create:
      - reminders:reminders:create
    write:
      - reminders:reminders:update
    delete:
      - reminders:reminders:delete

  accounts:
    read:
      - reminders:accounts:list

extraction:
  sourceFile: source.sdef
  confidence:
    overall: 0.85
    fields:
      resources: 0.95
      enums: 1.0
      hierarchy: 0.95
      commands: 0.85
  openQuestions:
    - question: What are the exact 4-char codes for Reminders.app resources and properties?
      context: Placeholder codes used - run sdef /System/Applications/Reminders.app to get exact codes
      relatedTo: all resources
    - question: Does Reminders.app expose an explicit complete command or is it done via setting the completed property?
      context: The completeReminder command may be a convenience wrapper over property update
      relatedTo: completeReminder
