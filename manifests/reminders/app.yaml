version: '1.0'

app:
  bundleId: com.apple.reminders
  name: Reminders
  displayName: Reminders
  tccEntitlements:
    - reminders
    - automation
  distributionModel: system

suites:
  - name: Standard Suite
    code: '????'
    description: Common classes and commands for all applications
  - name: Reminders
    code: '????'
    description: Reminders classes and commands
    resources:
      - Account
      - List
      - Reminder
    commands:
      - show
    enums:
      - ReminderPriority

resources:
  Account:
    name: Account
    plural: Accounts
    description: An account in the Reminders application
    code: '????'
    identifiers:
      - property: id
        primary: true
        unique: true
        evidence:
          unique:
            source: sdef
            note: 'The app''s scripting dictionary describes the property as "The unique identifier of the account"'
    rangeRead:
      supported: true
      evidence:
        source: probe
        observedAt: '2026-11-03T17:59:10.000Z'
        bundleId: com.apple.reminders
        appVersion: '7.0'
        osVersion: '27.2'
        note: 'Read-only pages of the accounts at the application, at page sizes 25, 2 and 1. The collection held one account, so no page continued past the first.'
    properties:
      name:
        access: r
        type: string
        description: The name of the account
        code: pnam
      id:
        access: r
        type: string
        description: The unique identifier of the account
        code: 'ID  '
    nullabilityProbe:
      observedAt: '2026-11-01T08:33:42.817Z'
      bundleId: com.apple.reminders
      appVersion: '7.0'
      osVersion: '27.2'
      accessPath: accounts
      itemsRead: 1
      sampledParents: 1
      status: probed
      skipped: []

  List:
    name: List
    plural: Lists
    description: A list of reminders
    code: '????'
    identifiers:
      - property: id
        primary: true
        unique: true
        evidence:
          unique:
            source: sdef
            note: 'The app''s scripting dictionary describes the property as "The unique identifier of the list"'
    rangeRead:
      supported: true
      evidence:
        source: probe
        observedAt: '2026-11-03T17:59:10.000Z'
        bundleId: com.apple.reminders
        appVersion: '7.0'
        osVersion: '27.2'
        note: 'Read-only pages of the lists at the application: a first page of 25, and pages of 2 continued by cursor to the last list, each read as a range of the collection.'
    properties:
      name:
        access: rw
        type: string
        description: The name of the list
        code: pnam
      id:
        access: r
        type: string
        description: The unique identifier of the list
        code: 'ID  '
      # The dictionary declares the list color as text, and the app returns a
      # string (Reminders 7.0, macOS 27.2), not an RGB value.
      color:
        access: rw
        type: string
        description: The color of the list
        code: colr
        nullable: true
        evidence:
          nullable:
            source: probe
            observedAt: '2026-11-01T08:33:42.817Z'
            bundleId: com.apple.reminders
            appVersion: '7.0'
            osVersion: '27.2'
            sampleSize: 3
