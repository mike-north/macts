version: '1.0'

app:
  bundleId: com.apple.TextEdit
  name: TextEdit
  displayName: TextEdit
  tccEntitlements:
    - automation
  distributionModel: system

suites:
  - name: Standard Suite
    code: '????'
    description: Common classes and commands for all applications
  - name: TextEdit Suite
    code: '????'
    description: TextEdit document classes
    resources:
      - Document

resources:
  Document:
    name: Document
    plural: Documents
    description: A TextEdit document
    code: docu
    # The dictionary's document class inherits `item`, which has only `class`
    # and `properties`; the class adds `name`, `modified` and `path`; it has no
    # `id` property, so a document is targeted by name, never by id.
    identifiers:
      - property: name
        primary: true
        targeting: byProperty
    properties:
      name:
        access: rw
        type: string
        description: The name of the document
        code: pnam
      path:
        access: r
        type: string
        description: The file path of the document
        code: ppth
        optional: true
      modified:
        access: r
        type: boolean
        description: Whether the document has been modified since last save
        code: imod
      text:
        access: rw
        type: string
        description: The text content of the document
        code: ctxt

hierarchy:
  children:
    documents:
      resource: Document
      access: rw
      description: Open documents in TextEdit

commands:
  list:
    name: list
    description: List all open documents
    scope: resource
    resourceType: Document
    parameters: []

  get:
    name: get
    description: Get a document by name
    scope: resource
    resourceType: Document
    parameters:
      - name: name
        type: string
        description: Document name
        required: true

  create:
    name: create
    description: Create a new document
    scope: resource
    resourceType: Document
    parameters:
      - name: text
        type: string
        description: Initial text content
        required: false

permissions:
  documents:
    read:
      - textedit:documents:list
      - textedit:documents:get
    create:
      - textedit:documents:create
