version: '1.0'

app:
  bundleId: com.microsoft.edgemac
  name: Microsoft Edge
  displayName: Microsoft Edge
  tccEntitlements:
    - automation
  distributionModel: developer-id

suites:
  - name: Standard Suite
    code: core
    description: Common classes and commands for all applications.
    resources:
      - Window
    commands:
      - save
      - open
      - close
      - quit
      - count
      - delete
      - duplicate
      - exists
      - make
      - move
      - print
  - name: Chromium Suite
    code: CrSu
    description: Common classes and commands for Edge.
    resources:
      - Tab
      - BookmarkFolder
      - BookmarkItem
    commands:
      - reload
      - goBack
      - goForward
      - selectAll
      - cutSelection
      - copySelection
      - pasteSelection
      - undo
      - redo
      - stop
      - viewSource
      - execute

resources:
  Window:
    name: Window
    plural: Windows
    description: A window.
    code: cwin
    properties:
      givenName:
        access: rw
        type: string
        description: The given name of the window.
        code: GNam
      name:
        access: r
        type: string
        description: The full title of the window.
        code: pnam
      id:
        access: r
        type: string
        description: The unique identifier of the window.
        code: 'ID  '
      index:
        access: rw
        type: integer
        description: The index of the window, ordered front to back.
        code: pidx
      bounds:
        access: rw
        type: rect
        description: The bounding rectangle of the window.
        code: pbnd
      closeable:
        access: r
        type: boolean
        description: Whether the window has a close box.
        code: hclb
      minimizable:
        access: r
        type: boolean
        description: Whether the window can be minimized.
        code: ismn
      minimized:
        access: rw
        type: boolean
        description: Whether the window is currently minimized.
        code: pmnd
      resizable:
        access: r
        type: boolean
        description: Whether the window can be resized.
        code: prsz
      visible:
        access: rw
        type: boolean
        description: Whether the window is currently visible.
        code: pvis
      zoomable:
        access: r
        type: boolean
        description: Whether the window can be zoomed.
        code: iszm
      zoomed:
        access: rw
        type: boolean
        description: Whether the window is currently zoomed.
        code: pzum
      activeTab:
        access: r
        type:
          resource: Tab
        description: Returns the currently selected tab
        code: acTa
      mode:
        access: rw
        type: string
        description: Represents the mode of the window which can be 'normal' or 'incognito', can be set only once during creation of the window.
        code: mode
      activeTabIndex:
        access: rw
        type: integer
        description: The index of the active tab.
        code: acTI
    identifiers:
      - property: id
        primary: true

  Tab:
    name: Tab
    plural: Tabs
    description: A tab.
    code: CrTb
    properties:
      id:
        access: r
        type: string
        description: Unique ID of the tab.
        code: 'ID  '
      title:
        access: r
        type: string
        description: The title of the tab.
        code: pnam
      uRL:
        access: rw
        type: string
        description: The url visible to the user.
        code: 'URL '
      loading:
        access: r
        type: boolean
        description: Is loading?
        code: ldng
    identifiers:
      - property: id
        primary: true

  BookmarkFolder:
    name: BookmarkFolder
    plural: BookmarkFolders
    description: A bookmarks folder that contains other bookmarks folder and bookmark items.
    code: CrBF
    properties:
      id:
        access: r
        type: string
        description: Unique ID of the bookmark folder.
        code: 'ID  '
      title:
        access: rw
        type: string
        description: The title of the folder.
        code: pnam
      index:
        access: r
        type: number
        description: Returns the index with respect to its parent bookmark folder.
        code: pidx
    identifiers:
      - property: id
        primary: true

  BookmarkItem:
    name: BookmarkItem
    plural: BookmarkItems
    description: An item consists of an URL and the title of a bookmark
    code: CrBI
    properties:
      id:
        access: r
        type: string
        description: Unique ID of the bookmark item.
        code: 'ID  '
      title:
        access: rw
        type: string
        description: The title of the bookmark item.
        code: pnam
      uRL:
        access: rw
        type: string
        description: The URL of the bookmark.
        code: 'URL '
      index:
        access: r
        type: number
        description: Returns the index with respect to its parent bookmark folder.
        code: pidx
    identifiers:
      - property: id
        primary: true

hierarchy:
  children:
    windows:
      resource: Window
      access: r
      description: The windows contained within this application
      children:
        tabs:
          resource: Tab
          access: r
          description: The tabs contained within the window
    bookmarkFolders:
      resource: BookmarkFolder
      access: r
      description: Contains the bookmarks bar and other bookmarks folder
      children:
        bookmarkFolders:
          resource: BookmarkFolder
          access: r
          description: The bookmark folders present within
        bookmarkItems:
          resource: BookmarkItem
          access: r
          description: The bookmarks present within

commands:
  listWindows:
    name: list
    description: List all windows
    scope: resource
    resourceType: Window
    code: core
    parameters: []
    permission: edge:windows:list

  getWindow:
    name: get
    description: Get a window by ID
    scope: resource
    resourceType: Window
    code: getd
    parameters:
      - name: id
        type: string
        description: Window identifier
        required: true
    permission: edge:windows:get

  createWindow:
    name: create
    description: Create a new window
    scope: resource
    resourceType: Window
    code: crel
    parameters:
      - name: mode
        type: string
        description: Window mode (normal or incognito)
        required: false
    permission: edge:windows:create

  listTabs:
    name: list
    description: List all tabs in a window
    scope: resource
    resourceType: Tab
    code: core
    parameters:
      - name: windowId
        type: string
        description: Window identifier
        required: true
    permission: edge:tabs:list

  getTab:
    name: get
    description: Get a tab by ID
    scope: resource
    resourceType: Tab
    code: getd
    parameters:
      - name: id
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:get

  createTab:
    name: create
    description: Create a new tab
    scope: resource
    resourceType: Tab
    code: crel
    parameters:
      - name: windowId
        type: string
        description: Window identifier for the tab
        required: true
      - name: uRL
        type: string
        description: URL to load in the tab
        required: false
    permission: edge:tabs:create

  listBookmarkFolders:
    name: list
    description: List all bookmark folders
    scope: resource
    resourceType: BookmarkFolder
    code: core
    parameters: []
    permission: edge:bookmarkFolders:list

  getBookmarkFolder:
    name: get
    description: Get a bookmark folder by ID
    scope: resource
    resourceType: BookmarkFolder
    code: getd
    parameters:
      - name: id
        type: string
        description: Bookmark folder identifier
        required: true
    permission: edge:bookmarkFolders:get

  listBookmarkItems:
    name: list
    description: List all bookmark items in a folder
    scope: resource
    resourceType: BookmarkItem
    code: core
    parameters:
      - name: folderId
        type: string
        description: Bookmark folder identifier
        required: true
    permission: edge:bookmarkItems:list

  getBookmarkItem:
    name: get
    description: Get a bookmark item by ID
    scope: resource
    resourceType: BookmarkItem
    code: getd
    parameters:
      - name: id
        type: string
        description: Bookmark item identifier
        required: true
    permission: edge:bookmarkItems:get

  reload:
    name: reload
    description: Reload a tab
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:reload

  goBack:
    name: goBack
    description: Go Back (If Possible)
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:goBack

  goForward:
    name: goForward
    description: Go Forward (If Possible)
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:goForward

  selectAll:
    name: selectAll
    description: Select all
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:selectAll

  cutSelection:
    name: cutSelection
    description: Cut selected text (If Possible)
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:cutSelection

  copySelection:
    name: copySelection
    description: Copy text
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:copySelection

  pasteSelection:
    name: pasteSelection
    description: Paste text (If Possible)
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:pasteSelection

  undo:
    name: undo
    description: Undo the last change
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:undo

  redo:
    name: redo
    description: Redo the last change
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:redo

  stop:
    name: stop
    description: Stop the current tab from loading
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:stop

  viewSource:
    name: viewSource
    description: View the HTML source of the tab
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
    permission: edge:tabs:viewSource

  execute:
    name: execute
    description: Execute a piece of javascript
    scope: resource
    resourceType: Tab
    code: CrSu
    parameters:
      - name: tabId
        type: string
        description: Tab identifier
        required: true
      - name: javascript
        type: string
        description: The javascript code to execute
        required: true
    permission: edge:tabs:execute

permissions:
  windows:
    read:
      - edge:windows:list
      - edge:windows:get
    create:
      - edge:windows:create
    write:
      - edge:windows:update
    delete:
      - edge:windows:delete

  tabs:
    read:
      - edge:tabs:list
      - edge:tabs:get
    create:
      - edge:tabs:create
    write:
      - edge:tabs:update
      - edge:tabs:reload
      - edge:tabs:goBack
      - edge:tabs:goForward
      - edge:tabs:selectAll
      - edge:tabs:cutSelection
      - edge:tabs:copySelection
      - edge:tabs:pasteSelection
      - edge:tabs:undo
      - edge:tabs:redo
      - edge:tabs:stop
      - edge:tabs:viewSource
      - edge:tabs:execute
    delete:
      - edge:tabs:delete

  bookmarkFolders:
    read:
      - edge:bookmarkFolders:list
      - edge:bookmarkFolders:get

  bookmarkItems:
    read:
      - edge:bookmarkItems:list
      - edge:bookmarkItems:get

extraction:
  sourceFile: edge-sdef.xml
  confidence:
    overall: 0.95
    fields:
      resources: 1.0
      commands: 0.95
      hierarchy: 0.95
