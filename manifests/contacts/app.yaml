commands:
  # Reads. People and groups are elements of the application; emails, phones
  # and addresses are elements of a person, so they are read under one.
  listPeople:
    name: list
    routeName: list
    description: List every person
    scope: resource
    resourceType: Person
    parameters: []
  getPerson:
    name: get
    routeName: get
    description: Get a person by identifier
    scope: resource
    resourceType: Person
    parameters:
      - name: id
        type: string
        description: Identifier of the person
        required: true
  listGroups:
    name: list
    routeName: list
    description: List every group
    scope: resource
    resourceType: Group
    parameters: []
  getGroup:
    name: get
    routeName: get
    description: Get a group by identifier
    scope: resource
    resourceType: Group
    parameters:
      - name: id
        type: string
        description: Identifier of the group
        required: true
  listEmails:
    name: list
    routeName: list
    description: List the email addresses of a person
    scope: resource
    resourceType: Email
    # The dictionary's `person` class has `email` as an element.
    parent:
      resource: Person
      parameter: personId
    parameters:
      - name: personId
        type: string
        description: Identifier of the person
        required: true
  getEmail:
    name: get
    routeName: get
    description: Get one email address of a person by its identifier
    scope: resource
    resourceType: Email
    parent:
      resource: Person
      parameter: personId
    parameters:
      - name: personId
        type: string
        description: Identifier of the person
        required: true
      - name: id
        type: string
        description: Identifier of the email address
        required: true
  listPhones:
    name: list
    routeName: list
    description: List the phone numbers of a person
    scope: resource
    resourceType: Phone
