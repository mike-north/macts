        code: az12
      lastName:
        access: rw
        type: string
        description: The Last name of this person.
        code: azf8
      firstName:
        access: rw
        type: string
        description: The First name of this person.
        code: azf7
  Phone:
    name: Phone
    plural: Phones
    description: Phone number for a person.
    code: az20
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this phone
        optional: false
