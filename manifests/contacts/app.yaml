    resourceType: Phone
    parent:
      resource: Person
      parameter: personId
    parameters:
      - name: personId
        type: string
        description: Identifier of the person
        required: true
      - name: id
        type: string
        description: Identifier of the phone number
        required: true
  listAddresses:
    name: list
    routeName: list
    description: List the addresses of a person
    scope: resource
    resourceType: Address
    # The dictionary's `person` class has `address` as an element.
    parent:
      resource: Person
      parameter: personId
    parameters:
      - name: personId
        type: string
        description: Identifier of the person
        required: true
  getAddress:
    name: get
    routeName: get
    description: Get one address of a person by its identifier
    scope: resource
    resourceType: Address
    parent:
      resource: Person
      parameter: personId
    parameters:
      - name: personId
        type: string
        description: Identifier of the person
        required: true
      - name: id
        type: string
        description: Identifier of the address
        required: true
