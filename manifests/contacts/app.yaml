version: '1.0'
app:
  bundleId: com.apple.AddressBook
  name: Contacts
  displayName: Contacts
  tccEntitlements:
    - automation
    - contacts
  distributionModel: system
suites:
  - name: Standard Suite
    code: ????
    description: Common classes and commands for all applications.
    commands:
      - make
  - name: Contacts Script Suite
    code: az00
    description: commands and classes for Contacts scripting.
    resources:
      - Address
      - AIMHandle
      - CustomDate
      - Email
      - Group
      - ICQHandle
      - InstantMessage
      - JabberHandle
      - MSNHandle
      - Person
      - Phone
      - RelatedName
      - SocialProfile
      - Url
      - YahooHandle
    enums:
      - SaveableFileFormat
      - InstantMessageServiceType
    commands:
      - add
      - remove
      - save
  - name: Address Book Rollover Suite
    code: az99
    description: These event definitions are used for constructing Address Book Rollover plug-ins. They would not normally appear in a typical end user script.
    commands:
      - actionProperty
      - actionTitle
      - performAction
      - shouldEnableAction
