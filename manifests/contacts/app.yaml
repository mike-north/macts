version: '1.0'
app:
  bundleId: com.apple.AddressBook
  name: Contacts
  displayName: Contacts
  tccEntitlements:
    - automation
    - contacts
  distributionModel: system
suites:
  - name: Standard Suite
    code: ????
    description: Common classes and commands for all applications.
    commands:
      - make
  - name: Contacts Script Suite
    code: az00
    description: commands and classes for Contacts scripting.
    resources:
      - Address
      - AIMHandle
      - CustomDate
      - Email
      - Group
      - ICQHandle
      - InstantMessage
      - JabberHandle
      - MSNHandle
      - Person
      - Phone
      - RelatedName
      - SocialProfile
      - Url
      - YahooHandle
    enums:
      - SaveableFileFormat
      - InstantMessageServiceType
    commands:
      - add
      - remove
      - save
  - name: Address Book Rollover Suite
    code: az99
    description: These event definitions are used for constructing Address Book Rollover plug-ins. They would not normally appear in a typical end user script.
    commands:
      - actionProperty
      - actionTitle
      - performAction
      - shouldEnableAction
resources:
  Address:
    name: Address
    plural: Addresses
    description: Address for the given record.
    code: az27
    properties:
      city:
        access: rw
        type: string
        description: City part of the address.
        code: az29
      formattedAddress:
        access: r
        type: string
        description: properly formatted string for this address.
        code: az65
      street:
        access: rw
        type: string
        description: Street part of the address, multiple lines separated by carriage returns.
        code: az28
      id:
        access: rw
        type: string
        description: unique identifier for this address.
        code: 'ID  '
      zip:
        access: rw
        type: string
        description: Zip or postal code of the address.
        code: az31
      country:
        access: rw
        type: string
        description: Country part of the address.
        code: az32
      label:
        access: rw
        type: string
        description: Label.
        code: az18
      countryCode:
        access: rw
        type: string
        description: Country code part of the address (should be a two character iso country code).
        code: az33
      state:
        access: rw
        type: string
        description: State, Province, or Region part of the address.
        code: az30
    identifiers:
      - property: id
        primary: true
  AIMHandle:
    name: AIMHandle
    plural: AIMHandles
    description: User name for America Online (AOL) instant messaging.
    code: az22
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this handle
        optional: false
        code: 'ID  '
      label:
        access: rw
        type: string
        description: Label for this handle
        optional: false
        code: az18
      value:
        access: rw
        type: string
        description: The AIM handle value
        optional: false
        code: valL

  CustomDate:
    name: CustomDate
    plural: CustomDates
    description: Arbitrary date associated with this person.
    code: az52
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this date
        optional: false
        code: 'ID  '
      label:
        access: rw
        type: string
        description: Label for this date
        optional: false
        code: az18
      value:
        access: rw
        type: date
        description: The date value
        optional: false
        code: valL

  Email:
    name: Email
    plural: Emails
    description: Email address for a person.
    code: az21
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this email
        optional: false
        code: 'ID  '
      label:
        access: rw
        type: string
        description: Label for this email
        optional: false
        code: az18
      value:
        access: rw
        type: string
        description: The email address
        optional: false
        code: valL

  Group:
    name: Group
    plural: Groups
    description: A Group Record in the address book database
    code: azf5
    properties:
      name:
        access: rw
        type: string
        description: The name of this group.
        code: pnam
  ICQHandle:
