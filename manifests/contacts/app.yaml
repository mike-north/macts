  Person:
    name: Person
    plural: People
    description: A person in the address book database.
    code: azf4
    # A person inherits the dictionary's `entry` class (azf6), whose `id`
    # ('ID  ') is "unique and persistent identifier for this record", so a
    # person is looked up by that id. The entry's `selected` (selE) is not
    # declared: it is window selection state, and reading it across 295 people
    # took 5.4 s on Contacts 14.0 (macOS 27.2), a fifth of a list's time limit.
    # The person's `vcard` (az49) and `image` (az50) are not declared either,
    # though the app provides both: a list would carry them for every person,
    # and the app reports them only one person at a time. On Contacts 14.0
    # (macOS 27.2), a list of 295 people that read them took 8.2 s and carried
    # 12,612,397 bytes of vCard text; 135 of the vCards embedded a photo, and
    # the largest was 1,161,851 bytes.
    identifiers:
      - property: id
        primary: true
        unique: true
        evidence:
          unique:
            source: sdef
            note: 'The app''s scripting dictionary describes the property as "unique and persistent identifier for this record."'
