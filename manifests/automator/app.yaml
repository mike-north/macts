version: '1.0'

app:
  bundleId: com.apple.Automator
  name: Automator
  displayName: Automator
  tccEntitlements:
    - automation
  distributionModel: system

suites:
  - name: Standard Suite
    code: '????'
    description: Common classes and commands for all applications
  - name: Automator Suite
    code: otto
    description: Terms and Events for controlling the Automator application
    resources:
      - Workflow
      - AutomatorAction
      - Variable
      - Setting
      - RequiredResource
    commands:
      - add
      - execute
      - remove
    enums:
      - WarningLevel

resources:
  Workflow:
    name: Workflow
    plural: Workflows
    description: A series of actions stored in a file
    code: wkfw
    identifiers:
      - property: name
        primary: true
    properties:
      name:
        access: r
        type: string
        description: The name of the workflow
        code: pnam
      currentAction:
        access: r
        type: any
        description: The current or most recent action of the workflow
        code: cact
      executionResult:
        access: r
        type: any
        description: The result of the most recent execution; the output of the last action of that execution
        code: xrsl
      executionErrorMessage:
        access: r
        type: string
        description: The text error message generated by the most recent execution
        code: xerm
      executionErrorNumber:
        access: r
        type: integer
        description: The numeric error code generated by the most recent execution
        code: xern
      executionId:
        access: r
        type: string
        description: The identifier of the current or most recent execution
        code: xidx

  AutomatorAction:
    name: AutomatorAction
    plural: AutomatorActions
    description: A single step in a workflow
    code: actz
    identifiers:
      - property: id
        primary: true
    properties:
      name:
        access: r
        type: string
        description: The localized name of the action
        code: pnam
      bundleId:
        access: r
        type: string
        description: The bundle identifier for the action
        code: bnid
      category:
        access: r
        type:
          array: string
        description: The category that contains the action
        code: ctgy
      comment:
        access: rw
        type: string
        description: The comment for the name of the action
        code: comt
      enabled:
        access: rw
        type: boolean
        description: Is the action enabled?
        code: enaB
      executionErrorMessage:
        access: r
        type: string
        description: The text error message generated by execution of the action
        code: xerm
      executionErrorNumber:
        access: r
        type: integer
        description: The numeric error code generated by execution of the action
        code: xern
      executionResult:
        access: r
        type: any
        description: The result of the action, passed as input to the next action
        code: xrsl
      iconName:
        access: r
        type: string
        description: The icon name of the action
        code: icnm
      id:
        access: r
        type: string
        description: The unique identifier for the action
        code: 'ID  '
      ignoresInput:
        access: rw
        type: boolean
        description: Shall the action ignore its input when it is run?
        code: igin
      index:
        access: rw
        type: integer
        description: The index of the action
        code: pidx
      inputTypes:
        access: r
        type:
          array: string
        description: The input types accepted by the action
        code: inty
      keywords:
        access: r
        type:
          array: string
        description: The keywords that describe the action
        code: kywd
      outputTypes:
        access: r
        type:
          array: string
        description: The output types produced by the action
        code: outy
      parentWorkflow:
        access: r
        type: any
        description: The workflow that contains the action
        code: pwkf
      path:
        access: r
        type: string
        description: The path of the file that contains the action
        code: ppth
      showActionWhenRun:
        access: rw
        type: boolean
        description: Shall the action show its user interface when it is run?
        code: shwr
      targetApplication:
        access: r
        type:
          array: string
        description: The application with which the action communicates
        code: tapp
      version:
        access: r
        type: string
        description: The version of the action
        code: vers
      warningAction:
        access: r
        type: string
        description: The action suggested by the warning, if any
        code: wact
      warningLevel:
        access: r
        type:
          enum: WarningLevel
        description: The level of the warning, increasing in likelihood of data loss
        code: wlev
      warningMessage:
        access: r
        type: string
        description: The message that accompanies the warning, if any
        code: wmsg

  Variable:
    name: Variable
    plural: Variables
    description: A variable used by the workflow
    code: vari
    identifiers:
      - property: id
        primary: true
    properties:
      name:
        access: rw
        type: string
        description: The name of the variable
        code: pnam
      value:
        access: rw
        type: any
        description: The value of the variable
        code: pval
      settable:
        access: r
        type: boolean
        description: Are the name and value of the variable settable?
        code: stbl
      id:
        access: r
        type: string
        description: The unique identifier for the variable
        code: 'ID  '

  Setting:
    name: Setting
    plural: Settings
    description: A named value in an action
    code: stng
    identifiers:
      - property: name
        primary: true
    properties:
      name:
        access: r
        type: string
        description: The name of the setting
        code: pnam
      value:
        access: rw
        type: any
        description: The value of the setting
        code: pval
      defaultValue:
        access: r
        type: any
        description: The default value of the setting
        code: dval

  RequiredResource:
    name: RequiredResource
    plural: RequiredResources
    description: A resource required for proper operation of the action
    code: reqr
    identifiers:
      - property: name
        primary: true
    properties:
      kind:
        access: r
        type: string
        description: The kind of required resource
        code: kind
      name:
        access: r
        type: string
        description: The name of the required resource
        code: pnam
      resource:
        access: r
        type: string
        description: The specification of the required resource
        code: rsrc
      version:
        access: r
        type: integer
        description: The minimum acceptable version of the required resource
        code: vers

enums:
  WarningLevel:
    name: WarningLevel
    description: The level of warning for an action
    code: wlev
    values:
      - name: none
        value: none
        description: No warning
        code: none
      - name: reversible
        value: reversible
        description: Reversible action
        code: rvbl
      - name: irreversible
        value: irreversible
        description: Irreversible action
        code: irrv

hierarchy:
  children:
    workflows:
      resource: Workflow
      access: rw
      description: Workflows in the application
      children:
        actions:
          resource: AutomatorAction
          access: rw
          description: Actions within a workflow
          children:
            settings:
              resource: Setting
              access: rw
              description: Settings for an action
            requiredResources:
              resource: RequiredResource
              access: r
              description: Required resources for an action
        variables:
          resource: Variable
          access: rw
          description: Variables within a workflow

commands:
  # Workflow commands
  list:
    name: list
    description: List all workflows
    scope: resource
    resourceType: Workflow
    code: core
    parameters: []
    permission: automator:workflows:list

  get:
    name: get
    description: Get a workflow by name
    scope: resource
    resourceType: Workflow
    code: getd
    parameters:
      - name: name
        type: string
        description: Workflow name
        required: true
    permission: automator:workflows:get

  execute:
    name: execute
    description: Execute a workflow
    scope: resource
    resourceType: Workflow
    code: exec
    parameters:
      - name: workflow
        type: any
        description: The workflow to execute
        required: true
    permission: automator:workflows:execute

  # AutomatorAction commands
  listActions:
    name: list
    description: List all actions in a workflow
    scope: resource
    resourceType: AutomatorAction
    code: core
    parameters:
      - name: workflowName
        type: string
        description: Workflow name
        required: true
    permission: automator:actions:list

  getAction:
    name: get
    description: Get an action by ID
    scope: resource
    resourceType: AutomatorAction
    code: getd
    parameters:
      - name: id
        type: string
        description: Action identifier
        required: true
    permission: automator:actions:get

  add:
    name: add
    description: Add an Automator action or variable to a workflow
    scope: application
    code: 'add '
    parameters:
      - name: object
        type: any
        description: The Automator action or variable to add
        required: true
      - name: to
        type: any
        description: The workflow to which the action or variable is to be added
        required: true
        code: insh
      - name: atIndex
        type: integer
        description: The index at which the action or variable is to be added
        required: false
        code: 'at I'
    permission: automator:workflows:add

  remove:
    name: remove
    description: Remove an Automator action or variable from a workflow
    scope: application
    code: remv
    parameters:
      - name: object
        type: any
        description: The Automator action or variable to remove
        required: true
    permission: automator:workflows:remove

  # Variable commands
  listVariables:
    name: list
    description: List all variables in a workflow
    scope: resource
    resourceType: Variable
    code: core
    parameters:
      - name: workflowName
        type: string
        description: Workflow name
        required: true
    permission: automator:variables:list

  getVariable:
    name: get
    description: Get a variable by ID
    scope: resource
    resourceType: Variable
    code: getd
    parameters:
      - name: id
        type: string
        description: Variable identifier
        required: true
    permission: automator:variables:get

  # Setting commands
  listSettings:
    name: list
    description: List all settings for an action
    scope: resource
    resourceType: Setting
    code: core
    parameters:
      - name: actionId
        type: string
        description: Action identifier
        required: true
    permission: automator:settings:list

  getSetting:
    name: get
    description: Get a setting by name
    scope: resource
    resourceType: Setting
    code: getd
    parameters:
      - name: name
        type: string
        description: Setting name
        required: true
    permission: automator:settings:get

  # RequiredResource commands
  listRequiredResources:
    name: list
    description: List all required resources for an action
    scope: resource
    resourceType: RequiredResource
    code: core
    parameters:
      - name: actionId
        type: string
        description: Action identifier
        required: true
    permission: automator:requiredResources:list

  getRequiredResource:
    name: get
    description: Get a required resource by name
    scope: resource
    resourceType: RequiredResource
    code: getd
    parameters:
      - name: name
        type: string
        description: Resource name
        required: true
    permission: automator:requiredResources:get

# Permissions mapping
permissions:
  workflows:
    read:
      - automator:workflows:list
      - automator:workflows:get
    create:
      - automator:workflows:create
    write:
      - automator:workflows:update
      - automator:workflows:execute
      - automator:workflows:add
      - automator:workflows:remove
    delete:
      - automator:workflows:delete

  actions:
    read:
      - automator:actions:list
      - automator:actions:get
    create:
      - automator:actions:create
    write:
      - automator:actions:update
    delete:
      - automator:actions:delete

  variables:
    read:
      - automator:variables:list
      - automator:variables:get
    create:
      - automator:variables:create
    write:
      - automator:variables:update
    delete:
      - automator:variables:delete

  settings:
    read:
      - automator:settings:list
      - automator:settings:get
    write:
      - automator:settings:update

  requiredResources:
    read:
      - automator:requiredResources:list
      - automator:requiredResources:get

extraction:
  sourceFile: Automator.scriptSuite + Automator.scriptTerminology
  confidence:
    overall: 0.95
    fields:
      resources: 1.0
      enums: 1.0
      hierarchy: 0.95
      commands: 0.95
