resources:
  Account:
    name: Account
    plural: Accounts
    description: A Notes account
    code: NTac
    properties:
      name:
        access: r
        type: string
        description: The name of the account
        code: pnam
        optional: false
      id:
        access: r
        type: string
        description: The unique identifier of the account
        code: 'ID  '
        optional: false
      upgraded:
        access: r
        type: boolean
        description: Whether the account has been upgraded
        code: upgr
        optional: false
    # The dictionary's account class declares `id` ("the unique identifier of
    # the account"). A name is neither stable nor unique, so an account is
    # identified by `id`.
    identifiers:
      - property: id
        primary: true
    nullabilityProbe:
      observedAt: '2026-11-02T20:09:20.597Z'
