hierarchy:
  children:
    accounts:
      resource: Account
      access: r
      description: Notes accounts
    folders:
      resource: Folder
      access: rw
      description: Notes folders
    notes:
      resource: Note
      access: rw
      description: All notes
relationships: []
commands:
  list:
    name: list
    description: List items
    scope: resource
    resourceType:
      - Account
      - Folder
      - Note
      - Attachment
    parameters: []
  get:
    name: get
    description: Get an item by identifier
    scope: resource
    resourceType:
      - Account
      - Folder
      - Note
    parameters:
      - name: id
        type: string
        description: Item identifier
        required: true
  getAttachment:
    name: get
    routeName: get
    description: Get an attachment by ID
    scope: resource
    resourceType: Attachment
    parameters:
      - name: id
        type: string
        description: Attachment identifier
        required: true
  create:
    name: create
    description: Create a new note
    scope: resource
    resourceType: Note
    # The dictionary's note class declares `name` with no access restriction,
    # so it is read-write and can be set at creation:
    # <property name="name" code="pnam" type="text" description="the name of the
    # note (normally the first line of the body)"/>
    parameters:
      - name: name
        type: string
        description: The name of the note (first line)
        required: false
      - name: body
        type: string
        description: HTML content of the note
        required: false
  show:
    name: show
    description: Show a note in the Notes app
    scope: resource
    resourceType: Note
    parameters:
      - name: name
        type: string
        description: Note name
        required: true
permissions:
  accounts:
    read:
      - notes:accounts:list
      - notes:accounts:get
  folders:
    read:
      - notes:folders:list
      - notes:folders:get
  notes:
    read:
      - notes:notes:list
      - notes:notes:get
    create:
      - notes:notes:create
