version: '1.0'
app:
  bundleId: com.apple.mail
  name: Mail
  displayName: Mail
  tccEntitlements:
    - automation
  distributionModel: system
suites:
  - name: Standard Suite
    code: ????
    description: Common classes and commands for all applications.
    commands:
      - delete
      - duplicate
      - move
  - name: Text Suite
    code: ????
    description: A set of basic classes for text processing.
    resources:
      - RichText
      - Attachment
      - Paragraph
      - Word
      - Character
      - AttributeRun
  - name: Mail
    code: emal
    description: Classes and commands for the Mail application
    resources:
      - OutgoingMessage
      - MessageViewer
    enums:
      - SaveableFileFormat
      - DefaultMessageFormat
      - HeaderDetail
      - LdapScope
      - QuotingColor
      - ViewerColumns
    commands:
      - bounce
      - checkForNewMail
      - extractNameFrom
      - extractAddressFrom
      - forward
      - getURL
      - importMailMailbox
      - mailto
      - performMailActionWithMessages
      - redirect
      - reply
      - send
      - synchronize
  - name: Mail Framework
    code: emsg
    description: Classes and commands for the Mail framework
    resources:
      - Message
      - Account
      - Mailbox
      - Rule
      - RuleCondition
      - Recipient
      - BccRecipient
      - CcRecipient
      - ToRecipient
      - Header
      - MailAttachment
    enums:
      - Authentication
      - HighlightColors
      - MessageCachingPolicy
      - RuleQualifier
      - RuleType
      - TypeOfAccount
resources:
  RichText:
    name: RichText
    plural: RichText
    description: Rich (styled) text
    code: ctxt
    properties:
      color:
        access: rw
        type: rgb
        description: The color of the first character.
        code: colr
      font:
        access: rw
        type: string
        description: The name of the font of the first character.
        code: font
      size:
        access: rw
        type: number
        description: The size in points of the first character.
        code: ptsz
  Attachment:
    name: Attachment
    plural: Attachments
    description: Represents an inline text attachment. This class is used mainly for make commands.
    code: atts
    properties:
      fileName:
        access: rw
        type: file
        description: The file for the attachment
        code: atfn
  Paragraph:
    name: Paragraph
    plural: Paragraphs
    description: This subdivides the text into paragraphs.
    code: cpar
    properties:
      color:
        access: rw
        type: rgb
        description: The color of the first character.
        code: colr
      font:
        access: rw
        type: string
        description: The name of the font of the first character.
        code: font
      size:
        access: rw
        type: number
        description: The size in points of the first character.
        code: ptsz
  Word:
    name: Word
    plural: Words
    description: This subdivides the text into words.
    code: cwor
    properties:
      color:
        access: rw
        type: rgb
        description: The color of the first character.
        code: colr
      font:
        access: rw
        type: string
        description: The name of the font of the first character.
        code: font
      size:
        access: rw
        type: number
        description: The size in points of the first character.
        code: ptsz
  Character:
    name: Character
    plural: Characters
    description: This subdivides the text into characters.
    code: 'cha '
    properties:
      color:
        access: rw
        type: rgb
        description: The color of the character.
        code: colr
      font:
        access: rw
        type: string
        description: The name of the font of the character.
        code: font
      size:
        access: rw
        type: number
        description: The size in points of the character.
        code: ptsz
  AttributeRun:
    name: AttributeRun
    plural: AttributeRuns
    description: This subdivides the text into chunks that all have the same attributes.
    code: catr
    properties:
      color:
        access: rw
        type: rgb
        description: The color of the first character.
        code: colr
      font:
        access: rw
        type: string
        description: The name of the font of the first character.
        code: font
      size:
        access: rw
        type: number
        description: The size in points of the first character.
        code: ptsz
  OutgoingMessage:
    name: OutgoingMessage
    plural: OutgoingMessages
    description: A new email message
    code: bcke
    properties:
      sender:
        access: rw
        type: string
        description: The sender of the message
        code: sndr
      subject:
        access: rw
        type: string
        description: The subject of the message
        code: subj
      visible:
        access: rw
        type: boolean
        description: Controls whether the message window is shown on the screen. The default is false
        code: pvis
      messageSignature:
        access: rw
        type: string
        description: The signature of the message
        code: tnrg
      id:
        access: r
        type: integer
        description: The unique identifier of the message
        code: 'ID  '
      htmlContent:
        access: rw
        type: string
        description: Does nothing at all (deprecated)
        code: htda
      vcardPath:
        access: rw
        type: file
        description: Does nothing at all (deprecated)
        code: htvc
    identifiers:
      - property: id
        primary: true
  MessageViewer:
    name: MessageViewer
    plural: MessageViewers
    description: Represents the object responsible for managing a viewer window
    code: mvwr
    properties:
      draftsMailbox:
        access: r
        type:
          resource: mailbox
        description: The top level Drafts mailbox
        code: drmb
      inbox:
        access: r
        type:
          resource: mailbox
        description: The top level In mailbox
        code: inmb
      junkMailbox:
        access: r
        type:
          resource: mailbox
        description: The top level Junk mailbox
        code: jkmb
      outbox:
        access: r
        type:
          resource: mailbox
        description: The top level Out mailbox
        code: oumb
      sentMailbox:
        access: r
        type:
          resource: mailbox
        description: The top level Sent mailbox
        code: stmb
      trashMailbox:
        access: r
        type:
          resource: mailbox
        description: The top level Trash mailbox
        code: trmb
      sortColumn:
        access: rw
        type: string
        description: The column that is currently sorted in the viewer
        code: mvsc
      sortedAscending:
        access: rw
        type: boolean
        description: Whether the viewer is sorted ascending or not
        code: mvsr
      mailboxListVisible:
        access: rw
        type: boolean
        description: Controls whether the list of mailboxes is visible or not
        code: mlsh
      previewPaneIsVisible:
        access: rw
        type: boolean
        description: Controls whether the preview pane of the message viewer window is visible or not
        code: mvpv
      visibleColumns:
        access: rw
        type: string
        description: List of columns that are visible. The subject column and the message status column will always be visible
        code: mvvc
      id:
        access: r
        type: integer
        description: The unique identifier of the message viewer
        code: 'ID  '
      visibleMessages:
        access: rw
        type: string
        description: List of messages currently being displayed in the viewer
        code: mvfm
      selectedMessages:
        access: rw
        type: string
        description: List of messages currently selected
        code: smgs
      selectedMailboxes:
        access: rw
        type: string
        description: List of mailboxes currently selected in the list of mailboxes
        code: msbx
    identifiers:
      - property: id
        primary: true
  Message:
    name: Message
    plural: Messages
    description: An email message
    code: mssg
    properties:
      id:
        access: r
        type: integer
        description: The unique identifier of the message.
        code: 'ID  '
      allHeaders:
        access: r
        type: string
        description: All the headers of the message
        code: alhe
      backgroundColor:
        access: rw
        type: string
        description: The background color of the message
        code: mcol
      mailbox:
        access: rw
        type:
          resource: mailbox
        description: The mailbox in which this message is filed
        code: mbxp
      content:
        access: r
        type:
          resource: rich text
        description: Contents of an email message
        code: ctnt
      dateReceived:
        access: r
        type: date
        description: The date a message was received
        code: rdrc
      dateSent:
        access: r
        type: date
        description: The date a message was sent
        code: drcv
      deletedStatus:
        access: rw
        type: boolean
        description: Indicates whether the message is deleted or not
        code: isdl
      flaggedStatus:
        access: rw
        type: boolean
        description: Indicates whether the message is flagged or not
        code: isfl
      flagIndex:
        access: rw
        type: integer
        description: The flag on the message, or -1 if the message is not flagged
        code: fidx
      junkMailStatus:
        access: rw
        type: boolean
        description: Indicates whether the message has been marked junk or evaluated to be junk by the junk mail filter.
        code: isjk
      readStatus:
        access: rw
        type: boolean
        description: Indicates whether the message is read or not
        code: isrd
      messageId:
        access: r
        type: string
        description: The unique message ID string
        code: meid
      source:
        access: r
        type: string
        description: Raw source of the message
        code: raso
      replyTo:
        access: r
        type: string
        description: The address that replies should be sent to
        code: rpto
      messageSize:
        access: r
        type: integer
        description: The size (in bytes) of a message
        code: msze
      sender:
        access: r
        type: string
        description: The sender of the message
        code: sndr
      subject:
        access: r
        type: string
        description: The subject of the message
        code: subj
      wasForwarded:
        access: r
        type: boolean
        description: Indicates whether the message was forwarded or not
        code: isfw
      wasRedirected:
        access: r
        type: boolean
        description: Indicates whether the message was redirected or not
        code: isrc
      wasRepliedTo:
        access: r
        type: boolean
        description: Indicates whether the message was replied to or not
        code: isrp
    identifiers:
      - property: id
        primary: true
  Account:
    name: Account
    plural: Accounts
    description: A Mail account for receiving messages (POP/IMAP). To create a new receiving account, use the 'pop account', 'imap account', and 'iCloud account' objects
    code: mact
    properties:
      deliveryAccount:
        access: rw
        type: string
        description: The delivery account used when sending mail from this account
        code: dact
      name:
        access: rw
        type: string
        description: The name of an account
        code: pnam
      id:
        access: r
        type: string
        description: The unique identifier of the account
        code: 'ID  '
      password:
        access: rw
        type: string
        description: Password for this account. Can be set, but not read via scripting
        code: macp
      authentication:
        access: rw
        type: string
        description: Preferred authentication scheme for account
        code: paus
      accountType:
        access: r
        type: string
        description: The type of an account
        code: atyp
      emailAddresses:
        access: rw
        type: string
        description: The list of email addresses configured for an account
        code: emad
      fullName:
        access: rw
        type: string
        description: The users full name configured for an account
        code: flln
      emptyJunkMessagesFrequency:
        access: rw
        type: integer
        description: Number of days before junk messages are deleted (0 = delete on quit, -1 = never delete)
        code: ejmf
      emptySentMessagesFrequency:
        access: rw
        type: integer
        description: Does nothing at all (deprecated)
        code: esmf
      emptyTrashFrequency:
        access: rw
        type: integer
        description: Number of days before messages in the trash are permanently deleted (0 = delete on quit, -1 = never delete)
        code: etrf
      emptyJunkMessagesOnQuit:
        access: rw
        type: boolean
        description: Indicates whether the messages in the junk messages mailboxes will be deleted on quit
        code: ejmo
      emptySentMessagesOnQuit:
        access: rw
        type: boolean
        description: Does nothing at all (deprecated)
        code: esmo
      emptyTrashOnQuit:
        access: rw
        type: boolean
        description: Indicates whether the messages in deleted messages mailboxes will be permanently deleted on quit
        code: etoq
      enabled:
        access: rw
        type: boolean
        description: Indicates whether the account is enabled or not
        code: isac
      userName:
        access: rw
        type: string
        description: The user name used to connect to an account
        code: unme
      accountDirectory:
        access: r
        type: file
        description: The directory where the account stores things on disk
        code: path
      port:
        access: rw
        type: integer
        description: The port used to connect to an account
        code: port
      serverName:
        access: rw
        type: string
        description: The host name used to connect to an account
        code: host
      includeWhenGettingNewMail:
        access: rw
        type: boolean
        description: Does nothing at all (deprecated)
        code: iwgm
      moveDeletedMessagesToTrash:
        access: rw
        type: boolean
        description: Indicates whether messages that are deleted will be moved to the trash mailbox
        code: smdm
      usesSsl:
        access: rw
        type: boolean
        description: Indicates whether SSL is enabled for this receiving account
        code: usss
    identifiers:
      - property: id
        primary: true
  Mailbox:
    name: Mailbox
    plural: Mailboxes
    description: A mailbox that holds messages
    code: mbxp
    properties:
      name:
        access: rw
        type: string
        description: The name of a mailbox
        code: pnam
      unreadCount:
        access: r
        type: integer
        description: The number of unread messages in the mailbox
        code: mbuc
      account:
        access: r
        type:
          resource: account
        description: The account property
        code: mact
      container:
        access: r
        type:
          resource: mailbox
        description: The container property
        code: mbxc
  Rule:
    name: Rule
    plural: Rules
    description: Class for message rules
    code: rule
    properties:
      colorMessage:
        access: rw
        type: string
        description: If rule matches, apply this color
        code: rcme
      deleteMessage:
        access: rw
        type: boolean
        description: If rule matches, delete message
        code: rdme
      forwardText:
        access: rw
        type: string
        description: If rule matches, prepend this text to the forwarded message. Set to empty string to include no prepended text
        code: rfte
      forwardMessage:
        access: rw
        type: string
        description: If rule matches, forward message to this address, or multiple addresses, separated by commas. Set to empty string to disable this action
        code: rfad
      markFlagged:
        access: rw
        type: boolean
        description: If rule matches, mark message as flagged
        code: rmfl
      markFlagIndex:
        access: rw
        type: integer
        description: If rule matches, mark message with the specified flag. Set to -1 to disable this action
        code: rfcl
      markRead:
        access: rw
        type: boolean
        description: If rule matches, mark message as read
        code: rmre
      playSound:
        access: rw
        type: string
        description: If rule matches, play this sound (specify name of sound or path to sound)
        code: rpso
      redirectMessage:
        access: rw
        type: string
        description: If rule matches, redirect message to this address or multiple addresses, separate by commas. Set to empty string to disable this action
        code: rrad
      replyText:
        access: rw
        type: string
        description: If rule matches, reply to message and prepend with this text. Set to empty string to disable this action
        code: rrte
      runScript:
        access: rw
        type: string
        description: If rule matches, run this compiled AppleScript file. Set to empty string to disable this action
        code: rras
      allConditionsMustBeMet:
        access: rw
        type: boolean
        description: Indicates whether all conditions must be met for rule to execute
        code: racm
      copyMessage:
        access: rw
        type:
          resource: mailbox
        description: If rule matches, copy to this mailbox
        code: rcmb
      moveMessage:
        access: rw
        type:
          resource: mailbox
        description: If rule matches, move to this mailbox
        code: rtme
      highlightTextUsingColor:
        access: rw
        type: boolean
        description: Indicates whether the color will be used to highlight the text or background of a message in the message list
        code: htuc
      enabled:
        access: rw
        type: boolean
        description: Indicates whether the rule is enabled
        code: isac
      name:
        access: rw
        type: string
        description: Name of rule
        code: pnam
      shouldCopyMessage:
        access: rw
        type: boolean
        description: Indicates whether the rule has a copy action
        code: rscm
      shouldMoveMessage:
        access: rw
        type: boolean
        description: Indicates whether the rule has a move action
        code: rstm
      stopEvaluatingRules:
        access: rw
        type: boolean
        description: If rule matches, stop rule evaluation for this message
        code: rser
  RuleCondition:
    name: RuleCondition
    plural: RuleConditions
    description: Class for conditions that can be attached to a single rule
    code: rucr
    properties:
      expression:
        access: rw
        type: string
        description: Rule expression field
        code: rexp
      header:
        access: rw
        type: string
        description: Rule header key
        code: rhed
      qualifier:
        access: rw
        type: string
        description: Rule qualifier
        code: rqua
      ruleType:
        access: rw
        type: string
        description: Rule type
        code: rtyp
  Recipient:
    name: Recipient
    plural: Recipients
    description: An email recipient
    code: rcpt
    properties:
      address:
        access: rw
        type: string
        description: The recipients email address
        code: radd
      name:
        access: rw
        type: string
        description: The name used for display
        code: pnam
  BccRecipient:
    name: BccRecipient
    plural: BccRecipients
    description: 'An email recipient in the Bcc: field'
    code: brcp
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this recipient
        optional: false
        code: 'ID  '

  CcRecipient:
    name: CcRecipient
    plural: CcRecipients
    description: 'An email recipient in the Cc: field'
    code: crcp
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this recipient
        optional: false
        code: 'ID  '

  ToRecipient:
    name: ToRecipient
    plural: ToRecipients
    description: 'An email recipient in the To: field'
    code: trcp
    properties:
      id:
        access: r
        type: string
        description: Unique identifier for this recipient
        optional: false
        code: 'ID  '

  Header:
    name: Header
    plural: Headers
    description: A header value for a message. E.g. To, Subject, From.
    code: mhdr
    properties:
      content:
        access: rw
        type: string
        description: Contents of the header
        code: ctnt
      name:
        access: rw
        type: string
        description: Name of the header value
        code: pnam
  MailAttachment:
    name: MailAttachment
    plural: MailAttachments
    description: A file attached to a received message.
    code: attc
    properties:
      name:
        access: r
        type: string
        description: Name of the attachment
        code: pnam
      mIMEType:
        access: r
        type: string
        description: MIME type of the attachment E.g. text/plain.
        code: attp
      fileSize:
        access: r
        type: integer
        description: Approximate size in bytes.
        code: atsz
      downloaded:
        access: r
        type: boolean
        description: Indicates whether the attachment has been downloaded.
        code: atdn
      id:
        access: r
        type: string
        description: The unique identifier of the attachment.
        code: 'ID  '
    identifiers:
      - property: id
        primary: true
enums:
  SaveableFileFormat:
    name: SaveableFileFormat
    code: savf
    values:
      - name: nativeFormat
        value: nativeFormat
        description: Native format
        code: item
  DefaultMessageFormat:
    name: DefaultMessageFormat
    code: edmf
    values:
      - name: plainFormat
        value: plainFormat
        description: Plain Text
        code: dmpt
      - name: richFormat
        value: richFormat
        description: Rich Text
        code: dmrt
  HeaderDetail:
    name: HeaderDetail
    code: hede
    values:
      - name: all
        value: all
        description: All
        code: hdal
      - name: custom
        value: custom
        description: Custom
        code: hdcu
      - name: default
        value: default
        description: Default
        code: hdde
      - name: noHeaders
        value: noHeaders
        description: No headers
        code: hdnn
  LdapScope:
    name: LdapScope
    code: ldas
    values:
      - name: base
        value: base
        description: LDAP scope of 'Base'
        code: lsba
      - name: oneLevel
        value: oneLevel
        description: LDAP scope of 'One Level'
        code: lsol
      - name: subtree
        value: subtree
        description: LDAP scope of 'Subtree'
        code: lsst
  QuotingColor:
    name: QuotingColor
    code: qqcl
    values:
      - name: blue
        value: blue
        description: Blue
        code: ccbl
      - name: green
        value: green
        description: Green
        code: ccgr
      - name: orange
        value: orange
        description: Orange
        code: ccor
      - name: other
        value: other
        description: Other
        code: ccot
      - name: purple
        value: purple
        description: Purple
        code: ccpu
      - name: red
        value: red
        description: Red
        code: ccre
      - name: yellow
        value: yellow
        description: Yellow
        code: ccye
  ViewerColumns:
    name: ViewerColumns
    code: mvcl
    values:
      - name: attachmentsColumn
        value: attachmentsColumn
        description: Column containing the number of attachments a message contains
        code: ecat
      - name: messageColor
        value: messageColor
        description: Used to indicate sorting should be done by color
        code: eccl
      - name: dateReceivedColumn
        value: dateReceivedColumn
        description: Column containing the date a message was received
        code: ecdr
      - name: dateSentColumn
        value: dateSentColumn
        description: Column containing the date a message was sent
        code: ecds
      - name: flagsColumn
        value: flagsColumn
        description: Column containing the flags of a message
        code: ecfl
      - name: fromColumn
        value: fromColumn
        description: Column containing the sender's name
        code: ecfr
      - name: mailboxColumn
        value: mailboxColumn
        description: Column containing the name of the mailbox or account a message is in
        code: ecmb
      - name: messageStatusColumn
        value: messageStatusColumn
        description: Column indicating a messages status (read, unread, replied to, forwarded, etc)
        code: ecms
      - name: numberColumn
        value: numberColumn
        description: Column containing the number of a message in a mailbox
        code: ecnm
      - name: sizeColumn
        value: sizeColumn
        description: Column containing the size of a message
        code: ecsz
      - name: subjectColumn
        value: subjectColumn
        description: Column containing the subject of a message
        code: ecsu
      - name: toColumn
        value: toColumn
        description: Column containing the recipients of a message
        code: ecto
      - name: dateLastSavedColumn
        value: dateLastSavedColumn
        description: Column containing the date a draft message was saved
        code: ecls
  Authentication:
    name: Authentication
    code: exut
    values:
      - name: password
        value: password
        description: Clear text password
        code: axct
      - name: apop
        value: apop
        description: APOP
        code: aapo
      - name: kerberos5
        value: kerberos5
        description: Kerberos V5 (GSSAPI)
        code: axk5
      - name: ntlm
        value: ntlm
        description: NTLM
        code: axnt
      - name: md5
        value: md5
        description: CRAM-MD5
        code: axmd
      - name: external
        value: external
        description: External authentication (TLS client certificate)
        code: aext
      - name: appleToken
        value: appleToken
        description: Apple token
        code: atok
      - name: none
        value: none
        description: None
        code: ccno
  HighlightColors:
    name: HighlightColors
    code: cclr
    values:
      - name: blue
        value: blue
        description: Blue
        code: ccbl
      - name: gray
        value: gray
        description: Gray
        code: ccgy
      - name: green
        value: green
        description: Green
        code: ccgr
      - name: none
        value: none
        description: None
        code: ccno
      - name: orange
        value: orange
        description: Orange
        code: ccor
      - name: other
        value: other
        description: Other
        code: ccot
      - name: purple
        value: purple
        description: Purple
        code: ccpu
      - name: red
        value: red
        description: Red
        code: ccre
      - name: yellow
        value: yellow
        description: Yellow
        code: ccye
