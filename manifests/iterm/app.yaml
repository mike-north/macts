enums:
  SaveOptions:
    name: SaveOptions
    code: savo
    values:
      - name: Yes
        value: yes
        description: Save the file.
        code: 'yes '
      - name: No
        value: no
        description: Do not save the file.
        code: 'no  '
      - name: Ask
        value: ask
        description: Ask the user whether or not to save the file.
        code: 'ask '
hierarchy:
  children:
    windows:
      resource: Window
      access: r
      description: A window.
      children:
        tabs:
          resource: Tab
          access: r
          description: A terminal tab
          children:
            sessions:
              resource: Session
              access: r
              description: A terminal session
commands:
  # The dictionary's application property "current window" (Crwn) is read
  # through its parameterless getter. The ordinary operation result is a
  # Window identity reference, so selecting another window later does not
  # change the object a previously returned reference denotes.
  currentWindow:
    name: currentWindow
    routeName: currentWindow
    description: Get a reference to the currently selected window.
    scope: application
    parameters: []
    returns: Window
    permission: iterm:app:currentWindow
    risk: read
  listWindows:
    name: list
    routeName: list
    description: List the windows
    scope: resource
    resourceType: Window
    parameters: []
  getWindow:
    name: get
    routeName: get
    description: Get a window by its ID
    scope: resource
    resourceType: Window
    parameters:
      - name: id
        type: integer
        description: Window identifier
        required: true
  # A tab is an element of its window only, and has no id, so it is listed
  # and got within the window, by its zero-based position there.
  listTabs:
    name: list
    routeName: list
    description: List the tabs of a window
    scope: resource
    resourceType: Tab
    parent:
      resource: Window
      parameter: windowId
    parameters:
      - name: windowId
        type: integer
        description: Window identifier
        required: true
  getTab:
    name: get
    routeName: get
    description: Get a tab of a window by its position
    scope: resource
    resourceType: Tab
    parent:
      resource: Window
      parameter: windowId
    parameters:
      - name: windowId
        type: integer
        description: Window identifier
        required: true
      - name: index
        type: integer
        description: The zero-based position of the tab within its window
        required: true
  count:
    name: count
    description: Return the number of elements of a particular class within an object.
    scope: application
    code: cnte
    parameters:
      - name: each
        type: string
        description: The class of objects to be counted.
        required: false
        code: kocl
  # Delete is not offered yet: as declared at application scope, it names no
  # item. A delete returns once it can name the item it acts on.
  duplicate:
    name: duplicate
    description: Copy object(s) and put the copies at a new location.
    scope: application
    code: clon
    parameters:
      - name: to
        type: string
        description: The location for the new object(s).
        required: true
        code: insh
      - name: withProperties
        type: any
        description: Properties to be set in the new duplicated object(s).
        required: false
        code: prdt
  exists:
    name: exists
    description: Verify if an object exists.
    scope: application
    code: doex
    parameters: []
  make:
    name: make
    description: Make a new object.
    scope: application
    code: crel
    parameters:
      - name: new
        type: string
        description: The class of the new object.
        required: true
        code: kocl
      - name: at
        type: string
        description: The location at which to insert the object.
        required: false
        code: insh
      - name: withData
        type: any
        description: The initial contents of the object.
        required: false
        code: data
      - name: withProperties
        type: any
        description: The initial values for properties of the object.
        required: false
        code: prdt
  move:
    name: move
    description: Move object(s) to a new location.
    scope: application
    code: move
    parameters:
      - name: to
        type: string
        description: The new location for the object(s).
        required: true
        code: insh
  close:
    name: close
    description: Close a document.
    scope: application
    code: clos
    parameters: []
  requestCookie:
    name: requestCookie
    description: Request a Python API cookie
    scope: application
    code: rqck
    parameters:
      - name: andKeyForAppNamed
        type: string
        description: Name of script using the cookie. This is shown in the console.
        required: false
        code: Rcsn
  createTab:
    name: createTab
    description: Create a new tab
    scope: application
    code: ntwp
    parameters:
      - name: withProfile
        type: string
        description: The profile name
        required: true
        code: Ntwp
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  createTabWithDefaultProfile:
    name: createTabWithDefaultProfile
    description: Create a new tab with the default profile
    scope: application
    code: ntwn
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  createWindowWithProfile:
    name: createWindowWithProfile
    description: Create a new window
    scope: application
    code: nwwp
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  createHotkeyWindowWithProfile:
    name: createHotkeyWindowWithProfile
    description: Create a hotkey window
    scope: application
    code: nhwp
    parameters: []
  launchAPIScriptNamed:
    name: launchAPIScriptNamed
    description: Launch API script by name
    scope: application
    code: lasn
    parameters:
      - name: arguments
        type: string
        description: Arguments to pass to script
        required: false
        code: Asar
  invokeAPIExpression:
    name: invokeAPIExpression
    description: Invokes an expression, such as a registered function.
    scope: application
    code: iaex
    parameters: []
  createWindowWithDefaultProfile:
    name: createWindowWithDefaultProfile
    description: Create a new window with the default profile
    scope: application
    code: nwwn
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  write:
    name: write
    description: Send text as though it was typed.
    scope: application
    code: sntx
    parameters:
      - name: contentsOfFile
        type: file
        description: Filename to send the contents of
        required: false
        code: Cofl
      - name: text
        type: string
        description: Text to send
        required: false
        code: Text
      - name: newline
        type: boolean
        description: 'If newline should be added to end of text (default: yes)'
        required: false
        code: Wtnl
  select:
    name: select
    description: Make receiver visible and selected.
    scope: application
    code: slct
    parameters: []
  splitVertically:
    name: splitVertically
    description: Split a session vertically.
    scope: application
    code: splv
    parameters:
      - name: withProfile
        type: string
        description: Name of profile for new session.
        required: true
        code: Prfl
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  splitVerticallyWithDefaultProfile:
    name: splitVerticallyWithDefaultProfile
    description: Split a session vertically, using the default profile for the new session
    scope: application
    code: svdp
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  splitVerticallyWithSameProfile:
    name: splitVerticallyWithSameProfile
    description: Split a session vertically, using the original session's profile for the new session
    scope: application
    code: svsp
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  splitHorizontally:
    name: splitHorizontally
    description: Split a session horizontally.
    scope: application
    code: splh
    parameters:
      - name: withProfile
        type: string
        description: Name of profile for new session.
        required: true
        code: Prfl
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  splitHorizontallyWithDefaultProfile:
    name: splitHorizontallyWithDefaultProfile
    description: Split a session horizontally, using the default profile for the new session
    scope: application
    code: shdp
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  splitHorizontallyWithSameProfile:
    name: splitHorizontallyWithSameProfile
    description: Split a session horizontally, using the original session's profile for the new session
    scope: application
    code: shsp
    parameters:
      - name: command
        type: string
        description: Shell command to run
        required: false
        code: Nwcm
  variable:
    name: variable
    description: Returns the value of a session variable with the given name
    scope: application
    code: varb
    parameters:
      - name: named
        type: string
        description: Name of variable
        required: true
        code: Namd
  setVariable:
    name: setVariable
    description: Sets the value of a session variable
    scope: application
    code: svar
    parameters:
      - name: named
        type: string
        description: Name of variable
        required: true
        code: Namd
      - name: to
        type: string
        description: New value
        required: true
        code: Tovl
  revealHotkeyWindow:
    name: revealHotkeyWindow
    description: Reveals a hotkey window. Only to be called on windows that are hotkey windows.
    scope: application
    code: rhkw
    parameters: []
  hideHotkeyWindow:
    name: hideHotkeyWindow
    description: Hides a hotkey window. Only to be called on windows that are hotkey windows.
    scope: application
    code: hhkw
    parameters: []
  toggleHotkeyWindow:
    name: toggleHotkeyWindow
    description: Toggles the visibility of a hotkey window. Only to be called on windows that are hotkey windows.
    scope: application
    code: thkw
    parameters: []
