version: '1.0'
app:
  bundleId: com.googlecode.iterm2
  name: iTerm
  displayName: iTerm
  tccEntitlements:
    - automation
  distributionModel: system
suites:
  - name: Standard Suite
    code: ????
    description: Common classes and commands for all applications.
    resources:
      - Window
    enums:
      - SaveOptions
    commands:
      - count
      - duplicate
      - exists
      - make
      - move
  - name: iTerm2 Suite
    code: Itrm
    description: Classes just for the iTerm2 application.
    resources:
      - Tab
      - Session
    commands:
      - close
      - requestCookie
      - createTab
      - createTabWithDefaultProfile
      - createWindowWithProfile
      - createHotkeyWindowWithProfile
      - launchAPIScriptNamed
      - invokeAPIExpression
      - createWindowWithDefaultProfile
      - write
      - select
      - splitVertically
      - splitVerticallyWithDefaultProfile
      - splitVerticallyWithSameProfile
      - splitHorizontally
      - splitHorizontallyWithDefaultProfile
      - splitHorizontallyWithSameProfile
      - variable
      - setVariable
      - revealHotkeyWindow
      - hideHotkeyWindow
      - toggleHotkeyWindow
resources:
  Window:
    name: Window
    plural: Windows
    description: A window.
    code: cwin
    properties:
      id:
        access: r
        type: integer
        description: The unique identifier of the session.
        code: 'ID  '
      alternateIdentifier:
        access: r
        type: string
        description: The alternate unique identifier of the session.
        code: Twid
      name:
        access: r
        type: string
        description: The full title of the window.
        code: pnam
      index:
        access: rw
        type: integer
        description: The index of the window, ordered front to back.
        code: pidx
      bounds:
        access: rw
        type: rect
        description: The bounding rectangle of the window.
        code: pbnd
      closeable:
        access: r
        type: boolean
        description: Whether the window has a close box.
        code: hclb
      miniaturizable:
        access: r
        type: boolean
        description: Whether the window can be minimized.
        code: ismn
      miniaturized:
        access: rw
        type: boolean
        description: Whether the window is currently minimized.
        code: pmnd
      resizable:
        access: r
        type: boolean
        description: Whether the window can be resized.
        code: prsz
      visible:
        access: rw
        type: boolean
        description: Whether the window is currently visible.
        code: pvis
      zoomable:
        access: r
        type: boolean
        description: Whether the window can be zoomed.
        code: iszm
      zoomed:
        access: rw
        type: boolean
        description: Whether the window is currently zoomed.
        code: pzum
      frontmost:
        access: rw
        type: boolean
        description: Whether the window is currently the frontmost window.
        code: pisf
      currentTab:
        access: rw
        type:
          resource: tab
        description: The currently selected tab
        code: Crtb
      currentSession:
        access: rw
        type:
          resource: session
        description: The current session in a window
        code: Wcsn
      isHotkeyWindow:
        access: rw
        type: boolean
        description: Whether the window is a hotkey window.
        code: ihkw
      hotkeyWindowProfile:
        access: rw
        type: string
        description: If the window is a hotkey window, this gives the name of the profile that created the window.
        code: hkwp
      # iTerm retains these deprecated compatibility getters in its dictionary,
      # but can fail to report them even while bounds remains readable. Optional
      # preserves their values when available without inventing a null or deriving
      # coordinates from bounds (the origin conventions are not interchangeable).
      position:
        access: rw
        optional: true
        deprecated:
          message: Use bounds instead.
        type: point
        description: Deprecated compatibility position relative to the upper left corner of the screen. Use bounds instead. Omitted when iTerm cannot report it.
        code: ppos
      origin:
        access: rw
        optional: true
        deprecated:
          message: Use bounds instead.
        type: point
        description: Deprecated compatibility position relative to the lower left corner of the screen. Use bounds instead. Omitted when iTerm cannot report it.
        code: pori
      size:
        access: rw
        optional: true
        deprecated:
          message: Use bounds instead.
        type: point
        description: Deprecated compatibility width and height of the window. Use bounds instead. Omitted when iTerm cannot report it.
        code: psiz
      frame:
        access: rw
        optional: true
        deprecated:
          message: Use bounds instead.
        type: rect
        description: Deprecated compatibility rectangle relative to the lower left corner of the screen. Use bounds instead. Omitted when iTerm cannot report it.
        code: pfra
    identifiers:
      - property: id
        primary: true
  Tab:
    name: Tab
    plural: Tabs
    description: A terminal tab
    code: Trmt
    # The dictionary gives a tab no id property, and the app's own specifier
    # for a window's current tab addresses it by position within the window.
    # A tab's `index` property is not used as that position: its base is the
    # app's, and the window `index` counts from 1. The owning window is part
    # of every tab reference; a position alone is not a tab identity.
    positional:
      evidence:
        source: curated
        note: >-
          Initially observed on 2026-11-04 on iTerm 3.7.6: five windows with one tab
          each, integer Window identities and currentTab specifiers addressing tabs
          within windows. Metadata-only validation on 2026-11-05 created two owned
          windows and three tabs in one: the selected second and third tabs used
          zero-based positions 1 and 2 within their own window. Selecting the third
          tab and closing earlier owned tabs shifted its position to 1 and then 0.
          The sibling window retained its own tab at position 0. The dictionary's
          index property was not used for addressing. Owned windows were removed
          and baseline windows preserved. No session or window/tab text was read.
          This validates adapter metadata and drift, not complete SDK record hydration.
        observedAt: '2026-11-05T21:19:08.471Z'
        appVersion: '3.7.6'
    properties:
      currentSession:
        access: rw
        type:
          resource: session
        description: The current session in a tab
        code: Wcsn
      index:
        access: rw
        type: integer
        description: Index of tab in parent tab view control
        code: Indx
      title:
        access: rw
        type: string
        description: The title property
        code: titl
