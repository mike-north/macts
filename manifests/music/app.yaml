hierarchy:
  children:
    airPlayDevices:
      resource: AirPlayDevice
      access: rw
      description: an AirPlay device
    browserWindows:
      resource: BrowserWindow
      access: rw
      description: the main window
    encoders:
      resource: Encoder
      access: rw
      description: converts a track to a specific file format
    eQPresets:
      resource: EQPreset
      access: rw
      description: equalizer preset configuration
    eQWindows:
      resource: EQWindow
      access: rw
      description: the equalizer window
    miniplayerWindows:
      resource: MiniplayerWindow
      access: rw
      description: the miniplayer window
    playlists:
      resource: Playlist
      access: rw
      description: a list of tracks/streams
      children:
        tracks:
          resource: Track
          access: rw
          description: playable audio source
          children:
            artworks:
              resource: Artwork
              access: rw
              description: a piece of art within a track or playlist
        artworks:
          resource: Artwork
          access: rw
          description: a piece of art within a track or playlist
    playlistWindows:
      resource: PlaylistWindow
      access: rw
      description: a sub-window showing a single playlist
    sources:
      resource: Source
      access: rw
      description: a media source (library, CD, device, etc.)
      children:
        audioCDPlaylists:
          resource: AudioCDPlaylist
          access: rw
          description: a playlist representing an audio CD
          children:
            audioCDTracks:
              resource: AudioCDTrack
              access: rw
              description: a track on an audio CD
        libraryPlaylists:
          resource: LibraryPlaylist
          access: rw
          description: the main library playlist
          children:
            fileTracks:
              resource: FileTrack
              access: rw
              description: a track representing an audio file (MP3, AIFF, etc.)
            uRLTracks:
              resource: URLTrack
              access: rw
              description: a track representing a network stream
            sharedTracks:
              resource: SharedTrack
              access: rw
              description: a track residing in a shared library
        playlists:
          resource: Playlist
          access: rw
          description: a list of tracks/streams
          children:
            tracks:
              resource: Track
              access: rw
              description: playable audio source
              children:
                artworks:
                  resource: Artwork
                  access: rw
                  description: a piece of art within a track or playlist
            artworks:
              resource: Artwork
              access: rw
              description: a piece of art within a track or playlist
        radioTunerPlaylists:
          resource: RadioTunerPlaylist
          access: rw
          description: the radio tuner playlist
          children:
            uRLTracks:
              resource: URLTrack
              access: rw
              description: a track representing a network stream
        subscriptionPlaylists:
          resource: SubscriptionPlaylist
          access: rw
          description: a subscription playlist from Apple Music
          children:
            fileTracks:
              resource: FileTrack
              access: rw
              description: a track representing an audio file (MP3, AIFF, etc.)
            uRLTracks:
              resource: URLTrack
              access: rw
              description: a track representing a network stream
        userPlaylists:
          resource: UserPlaylist
          access: rw
          description: custom playlists created by the user
          children:
            fileTracks:
              resource: FileTrack
              access: rw
              description: a track representing an audio file (MP3, AIFF, etc.)
            uRLTracks:
              resource: URLTrack
              access: rw
              description: a track representing a network stream
            sharedTracks:
              resource: SharedTrack
              access: rw
              description: a track residing in a shared library
    tracks:
      resource: Track
      access: rw
      description: playable audio source
      children:
        artworks:
          resource: Artwork
          access: rw
          description: a piece of art within a track or playlist
    videoWindows:
      resource: VideoWindow
      access: rw
      description: the video window
    visuals:
      resource: Visual
      access: rw
      description: a visual plug-in
commands:
  print:
    name: print
    description: Print the specified object(s)
    scope: application
    code: pdoc
    parameters:
      - name: printDialog
        type: boolean
        description: Should the application show the print dialog
        required: false
        code: pdlg
      - name: withProperties
        type: string
        description: the print settings
        required: false
        code: prdt
      - name: kind
        type: string
        description: the kind of printout desired
        required: false
        code: pKnd
      - name: theme
        type: string
        description: name of theme to use for formatting the printout
        required: false
        code: pThm
  close:
    name: close
    description: Close an object
    scope: application
    code: clos
    parameters: []
  count:
    name: count
    description: Return the number of elements of a particular class within an object
    scope: application
    code: cnte
    parameters:
      - name: each
        type: string
        description: the class of the elements to be counted. Keyword 'each' is optional in AppleScript
        required: true
        code: kocl
  delete:
    name: delete
    description: Delete an element from an object
    scope: application
    code: delo
    parameters: []
  duplicate:
    name: duplicate
    description: Duplicate one or more object(s)
    scope: application
    code: clon
    parameters:
      - name: to
        type: string
        description: the new location for the object(s)
        required: false
        code: insh
  exists:
    name: exists
    description: Verify if an object exists
    scope: application
    code: doex
    parameters: []
  make:
    name: make
    description: Make a new element
    scope: application
    code: crel
    parameters:
      - name: new
        type: string
        description: the class of the new element. Keyword 'new' is optional in AppleScript
        required: true
        code: kocl
      - name: at
        type: string
        description: the location at which to insert the element
        required: false
        code: insh
      - name: withProperties
        type: any
        description: the initial values for the properties of the element
        required: false
        code: prdt
  move:
    name: move
    description: Move playlist(s) to a new location
    scope: resource
    resourceType: Playlist
    code: move
    parameters:
      - name: to
        type: string
        description: the new location for the playlist(s)
        required: true
        code: insh
  open:
    name: open
    description: Open the specified object(s)
    scope: application
    code: odoc
    parameters: []
  run:
    name: run
    description: Run the application
    scope: application
    code: oapp
    parameters: []
  quit:
    name: quit
    description: Quit the application
    scope: application
    code: quit
    parameters: []
  save:
    name: save
    description: Save the specified object(s)
    scope: application
    code: save
    parameters: []
  add:
    name: add
    description: add one or more files to a playlist
    scope: application
    code: hAdd
    parameters:
      - name: to
        type: string
        description: the location of the added file(s)
        required: false
        code: insh
  backTrack:
    name: backTrack
    description: reposition to beginning of current track or go to previous track if already at start of current track
    scope: application
    code: hBak
    parameters: []
  convert:
    name: convert
    description: convert one or more files or tracks
    scope: application
    code: 'hCnv'
    parameters: []
  download:
    name: download
    description: download a cloud track or playlist
    scope: application
    code: 'hDwn'
    parameters: []
  export:
    name: export
    description: export a source or playlist
    scope: application
    code: 'hExp'
    parameters:
      - name: as
        type: string
        description: the format to export for a playlist
        required: false
        code: pExF
      - name: to
        type: file
        description: the destination of the export
        required: false
        code: insh
  fastForward:
    name: fastForward
    description: skip forward in a playing track
    scope: application
    code: 'hFst'
    parameters: []
  nextTrack:
    name: nextTrack
    description: advance to the next track in the current playlist
    scope: application
    code: 'hNxt'
    parameters: []
  pause:
    name: pause
    description: pause playback
    scope: application
    code: 'hPau'
    parameters: []
  play:
    name: play
    description: play the current track or the specified track or file.
    scope: application
    code: 'hPly'
    parameters:
      - name: once
        type: boolean
        description: If true, play this track once and then stop.
        required: false
        code: POne
  playpause:
    name: playpause
    description: toggle the playing/paused state of the current track
    scope: application
    code: 'hPlP'
    parameters: []
  previousTrack:
    name: previousTrack
    description: return to the previous track in the current playlist
    scope: application
    code: 'hPrv'
    parameters: []
  refresh:
    name: refresh
    description: update file track information from the current information in the track’s file
    scope: resource
    resourceType: FileTrack
    code: 'hRfr'
    parameters: []
  resume:
    name: resume
    description: disable fast forward/rewind and resume playback, if playing.
    scope: application
    code: 'hRsu'
    parameters: []
  reveal:
    name: reveal
    description: reveal and select a track or playlist
    scope: application
    code: 'hRvl'
    parameters: []
  rewind:
    name: rewind
    description: skip backwards in a playing track
    scope: application
    code: 'hRwn'
    parameters: []
  search:
    name: search
    description: search a playlist for tracks matching the search string. Identical to entering search text in the Search field.
    scope: resource
    resourceType: Playlist
    code: 'hSrc'
    parameters:
      - name: for
        type: string
        description: the search text
        required: true
        code: pTrm
      - name: only
        type: string
        description: area to search (default is all)
        required: false
        code: pAre
  select:
    name: select
    description: select the specified object(s)
    scope: application
    code: slct
    parameters: []
  stop:
    name: stop
    description: stop playback
    scope: application
    code: 'hStp'
    parameters: []
  openLocation:
    name: openLocation
    description: Opens an iTunes Store or audio stream URL
    scope: application
    code: GURL
    parameters: []
