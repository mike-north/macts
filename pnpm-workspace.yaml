# pnpm workspace configuration
packages:
  - 'packages/*'
  - 'manifests/*'

# Allow build scripts for approved packages
onlyBuiltDependencies:
  - '@withgraphite/graphite-cli'
  - 'esbuild'
  - 'nx'

# Shared dependency versions across packages
catalog:
  tsup: ^8.5.1
  vitest: ^3.1.0
  typescript: 5.9.3
  yaml: ^2.7.0
