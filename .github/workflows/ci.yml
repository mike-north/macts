name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: build (node ${{ matrix.node-version }})
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Guard against committed generated artifacts drifting from the generator.
      # Regenerates every package from its manifest and fails if the working tree
      # changes — committed output must exactly match a fresh regeneration.
      - name: Generated artifacts are up to date
        run: pnpm generate:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      # macts is intentionally pre-1.0. Changesets can reach a major bump with
      # no `major` changeset present — a peerDependencies edge is enough, and
      # fixed versioning then spreads it to every package. Catch that here
      # rather than in a "Version Packages" PR nobody expected.
      - name: Release plan stays below 1.0
        run: pnpm release:plan-check
