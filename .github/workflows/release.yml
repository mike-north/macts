name: Release

on:
  push:
    branches:
      - main

# Never run two release jobs at once; do not cancel an in-flight publish.
concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version branch, tags, GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC exchange for npm trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm ci:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify npm authentication failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Print bounded failure categories while retaining identity material privately.
          files = sorted((Path.home() / '.npm/_logs').glob('*-debug-0.log'))
          found = False
          for path in files:
              text = path.read_text(errors='replace')
              if 'ENEEDAUTH' not in text:
                  continue
              found = True
              print('npm publish ended without usable credentials')
              statuses = re.findall(
                  r'\bPOST\s+([1-5][0-9]{2})\s+'
                  r'https://registry\.npmjs\.org/-/npm/v1/oidc/token/exchange/',
                  text,
              )
              for status in statuses:
                  print('npm OIDC exchange HTTP status:', status)
              markers = {
                  'Skipped because incorrect permissions for id-token': 'identity permissions unavailable',
                  'Skipped because no id_token available': 'identity token unavailable',
                  'Failed to fetch id_token from GitHub': 'identity retrieval failed',
                  'Failed token exchange request': 'package credential exchange failed',
                  'Failed because token exchange was missing': 'exchange response lacked credential',
                  'Successfully retrieved and set token': 'credential was set before later failure',
                  'oidc Failure with message:': 'OIDC helper caught another exception',
              }
              for marker, label in markers.items():
                  if marker in text:
                      print('npm OIDC category:', label)
          if not found:
              print('No retained npm ENEEDAUTH debug log found')
          PY
